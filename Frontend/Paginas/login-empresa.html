  <script>try{var t=localStorage.getItem("saops_tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t}catch(e){}</script>

<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.png" alt=""> SAOPS</a>
    <a href="index.html">&larr; Voltar</a>
    <h1>Entrar como prestador</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>
    <p id="erro_login" class="erro-msg" hidden></p>
    <form id="form_login_empresa" action="painel-prestador.html" method="get">
      <label for="txt_identificador_login_empresa">E-mail ou CNPJ</label>
      <input type="text" id="txt_identificador_login_empresa" name="identificador" placeholder="empresa@email.com" required>

      <label for="txt_senha_login_empresa">Senha</label>
      <input type="password" id="txt_senha_login_empresa" name="senha" placeholder="********" required>

      <button type="submit" id="btn_entrar_empresa">Entrar</button>
    </form>

    <div class="social-login">
      <p class="social-titulo">ou entre com</p>
      <div id="google_btn"></div>
      <button type="button" id="ms_btn" class="social-btn">
        <span class="icone-ms"><i></i><i></i><i></i><i></i></span> Entrar com Microsoft
      </button>
    </div>

    <a href="cadastro-empresa.html">Cadastrar meu negócio</a>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script src="../js/lembretes.js"></script>
<script src="../js/social.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  // Login real do prestador via API (aceita e-mail ou nome do negócio)
  document.getElementById('form_login_empresa').addEventListener('submit', async (e) => {
    e.preventDefault();
    const erro = document.getElementById('erro_login');
    const identificador = document.getElementById('txt_identificador_login_empresa').value.trim().toLowerCase();
    const senha = document.getElementById('txt_senha_login_empresa').value;

    const btn = document.getElementById('btn_entrar_empresa');
    btn.disabled = true;
    const r = await entrarConta(identificador, senha);
    btn.disabled = false;

    if (!r.sucesso) {
      erro.hidden = false;
      erro.textContent = r.erro;
      return;
    }
    salvarSessaoLocal(r.usuario);
    window.location.href = voltarAposLogin('painel-prestador.html');
  });

  iniciarLoginSocial({ destino: 'painel-prestador.html' });
</script>

<script src="../js/tema.js"></script>
</body>
</html>
