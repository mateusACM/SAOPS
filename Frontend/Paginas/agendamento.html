<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:description" content="Marque um horário: escolha o serviço, o dia e o horário em poucos passos no SAOPS.">

  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <script>try{var t=localStorage.getItem("saops_tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.png" alt=""> SAOPS</a>
    <a href="busca.html">&larr; Voltar</a>
    <h1 id="nome_prestador">Agendar horário</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>
    <form id="form_agendamento" action="confirmacao-agendamento.html" method="get">

      <section>
        <h2>Seus dados</h2>
        <label for="txt_nome">Nome completo</label>
        <input type="text" id="txt_nome" name="nome_cliente" placeholder="Ex: João Silva" required>
        <label for="txt_telefone">Telefone (opcional)</label>
        <input type="tel" id="txt_telefone" name="telefone" placeholder="Ex: (11) 98765-4321">
      </section>

      <section>
        <h2>Escolha o serviço</h2>
        <div class="servicos-grid" id="lista_servicos_reserva"><p>Carregando serviços...</p></div>
      </section>

      <section>
        <h2>Data e horário</h2>
        <label for="txt_data">Data</label>
        <input type="date" id="txt_data" name="data" required>
        <h3>Horários disponíveis</h3>
        <p id="aviso_vagas" class="aviso-vagas"></p>
        <div class="slots-grid" id="grade_horarios" aria-live="polite"></div>
      </section>

      <button type="submit" id="btn_confirmar_agendamento">Confirmar agendamento</button>

    </form>
  </main>
<!-- IMPORTAR OS ARQUIVOS DE API E CATÁLOGO -->
<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script src="../js/lembretes.js"></script>


<!-- SCRIPT PARA LIDAR COM O FORMULÁRIO -->
<script>
    // Mostra o prestador escolhido (vem de detalhes-prestador.html?prestador=ID)
    const prestadorId = new URLSearchParams(window.location.search).get('prestador');
    let prestador = null;
    document.getElementById('nome_prestador').textContent = 'Agendar horário';
    const radios = document.getElementById('lista_servicos_reserva');
    const carregaPrestador = async () => {
      const r = await listarPrestadores();
      prestador = r.sucesso ? r.dados.find((p) => String(p.id) === String(prestadorId)) : null;
      document.getElementById('nome_prestador').textContent = prestador ? prestador.nome : 'Prestador não encontrado';
      radios.replaceChildren();
      const servicoInicial = new URLSearchParams(window.location.search).get('servico');
      (prestador?.servicos || []).forEach((s, i) => { const label = document.createElement('label'); label.className = 'servico-card'; const input = document.createElement('input'); input.type = 'radio'; input.name = 'servico'; input.value = s.nome; input.required = true; if ((servicoInicial && s.nome === servicoInicial) || (!servicoInicial && !i)) input.checked = true; input.addEventListener('change', atualizarVagas); const nome = document.createElement('span'); nome.className = 's-nome'; nome.textContent = s.nome; const info = document.createElement('span'); info.className = 's-detalhe'; info.textContent = s.duracao_min ? `${s.duracao_min} min` : ''; const preco = document.createElement('span'); preco.className = 's-preco'; preco.textContent = s.preco == null ? 'Preço a combinar' : `R$ ${Number(s.preco).toFixed(2).replace('.', ',')}`; label.append(input, nome, info, preco); radios.append(label); });
      if (!prestador?.servicos?.length) radios.textContent = 'Este prestador não possui serviços disponíveis.';
      atualizarVagas();
    };
    carregaPrestador();
    // Data mínima = hoje (evita erro "datas passadas" do backend)
    // Aceita ?data=YYYY-MM-DD (vem do calendário)
    const campoData = document.getElementById('txt_data');
    // Data local (toISOString é UTC e erra o dia após 21h no BRT)
    const agora = new Date();
    const hoje = agora.getFullYear() + '-' + String(agora.getMonth() + 1).padStart(2, '0') + '-' + String(agora.getDate()).padStart(2, '0');
    campoData.min = hoje;
    const dataParam = new URLSearchParams(window.location.search).get('data');
    campoData.value = (dataParam && dataParam >= hoje) ? dataParam : hoje;

    // Gera horários a partir do expediente definido pelo prestador e respeita duração e conflitos.
    async function atualizarVagas() {
      const aviso = document.getElementById('aviso_vagas');
      const grade = document.getElementById('grade_horarios');
      grade.replaceChildren();
      aviso.className = 'aviso-vagas';

      const data = campoData.value;
      if (!data) { aviso.textContent = ''; return; }
      if (!prestador) { aviso.textContent = 'Carregando a agenda do prestador…'; return; }
      const dia = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'][new Date(`${data}T12:00:00`).getDay()];
      const disponibilidade = prestador.disponibilidade || {};
      const expediente = disponibilidade[dia];
      if (!expediente?.ativo) { aviso.textContent = 'Esse prestador não atende neste dia.'; return; }
      const servicoEscolhido = form.querySelector('input[name="servico"]:checked');
      const servico = (prestador.servicos || []).find((s) => s.nome === servicoEscolhido?.value);
      if (!servico) { aviso.textContent = 'Escolha um serviço para ver os horários.'; return; }
      const emMinutos = (hora) => Number(hora.slice(0, 2)) * 60 + Number(hora.slice(3, 5));
      const formatarHora = (minutos) => `${String(Math.floor(minutos / 60)).padStart(2, '0')}:${String(minutos % 60).padStart(2, '0')}`;
      const inicio = emMinutos(expediente.inicio);
      const fim = emMinutos(expediente.fim);
      const intervalo = Number(disponibilidade.intervalo_min || 30);
      const duracao = Number(servico.duracao_min || intervalo);
      const horarios = [];
      for (let minuto = inicio; minuto + duracao <= fim; minuto += intervalo) horarios.push(formatarHora(minuto));
      if (!horarios.length) { aviso.textContent = 'Não há horários para esse serviço neste dia.'; return; }
      aviso.textContent = 'Verificando horários...';
      const r = await buscarAgendamentosPorData(data, prestadorId);
      if (!r.sucesso) {
        aviso.textContent = 'Não foi possível verificar vagas: ' + r.erro;
        return;
      }
      const ocupados = r.dados.map((a) => ({ inicio: emMinutos(a.horario), fim: emMinutos(a.horario) + Number(a.duracao_min || 30) }));
      let livres = 0;
      horarios.forEach((hora, i) => {
        const minuto = emMinutos(hora);
        const bloqueado = ocupados.some((a) => minuto < a.fim && a.inicio < minuto + duracao);
        const label = document.createElement('label'); label.className = 'slot-pill';
        const radio = document.createElement('input'); radio.type = 'radio'; radio.name = 'horario'; radio.value = hora; radio.required = i === 0; radio.disabled = bloqueado;
        const texto = document.createTextNode(hora); label.append(radio, texto); grade.append(label);
        if (!bloqueado) livres++;
      });
      if (livres === 0) {
        aviso.textContent = 'Não há horários livres para esse serviço. Escolha outro dia.';
        aviso.classList.add('aviso');
      } else {
        aviso.textContent = `${livres} horários livres · ${expediente.inicio} às ${expediente.fim} · ${duracao} min`;
        aviso.classList.add('ok');
      }
    }

    campoData.addEventListener('change', atualizarVagas);

    // Preenche nome/telefone salvos anteriormente
    document.getElementById('txt_nome').value = localStorage.getItem('nome_cliente') || '';
    document.getElementById('txt_telefone').value = localStorage.getItem('telefone') || '';

    // Pega o formulário
    const form = document.getElementById('form_agendamento');

    // Carrega as vagas da data inicial
    if (typeof buscarAgendamentosPorData === 'function') atualizarVagas();

    // Quando o formulário é enviado
    form.addEventListener('submit', async (evento) => {
        evento.preventDefault(); // Não recarrega a página

        // Pega os dados do formulário
        if (!(await exigirLogin('login-cliente.html'))) return;
        const servicoSelecionado = form.querySelector('input[name="servico"]:checked');
        if (!prestador || !servicoSelecionado) { toast('Escolha um prestador com serviço disponível.', 'erro'); return; }
        const servico = servicoSelecionado.value;
        const horarioEl = form.querySelector('input[name="horario"]:checked');
        const nome_cliente = document.getElementById('txt_nome').value.trim();
        const telefone = document.getElementById('txt_telefone').value.trim();
        const data = campoData.value;

        if (!nome_cliente) {
            toast('Preencha seu nome.', 'erro');
            return;
        }
        if (!data) {
            toast('Escolha a data.', 'erro');
            return;
        }
        if (!horarioEl) {
            toast('Escolha um horário.', 'erro');
            return;
        }

        // Salva para reaproveitar nas próximas vezes
        localStorage.setItem('nome_cliente', nome_cliente);
        localStorage.setItem('telefone', telefone);

        // Dados que vão pra API
        const dados = {
            nome_cliente: nome_cliente,
            servico: servico,
            data: data,
            horario: horarioEl.value,
            telefone: telefone,
            status: "agendado",
            prestador_id: prestador.id
        };

        const btn = document.getElementById('btn_confirmar_agendamento');
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        try {
            if (!(await exigirLogin('login-cliente.html'))) return;
            // Chama a API
            const resultado = await criarAgendamento(dados);

            if (resultado.naoAutenticado) { exigirLogin('login-cliente.html'); return; }

            if (resultado.sucesso) {
                // Sucesso! Guarda o ID para a tela de confirmação e redireciona
                try { sessionStorage.setItem('ultimo_agendamento_id', String(resultado.dados.id)); } catch (e) {}
                window.location.href = 'confirmacao-agendamento.html?id=' + resultado.dados.id;
            } else {
                // Erro! Mostra mensagem
                toast('Erro: ' + resultado.erro, 'erro');
            }
        } catch (e) {
            toast('Sem conexão com o servidor. Rode npm start na pasta Backend.', 'erro');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Confirmar agendamento';
        }
    });
</script>
<script src="../js/tema.js"></script>
</body>
</html>
