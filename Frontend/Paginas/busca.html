  <meta name="theme-color" content="#03071f">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://saops.onrender.com/busca">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SAOPS">

  <meta property="og:description" content="Busque prestadores e serviços por nome ou categoria e marque horários online no SAOPS.">

  <meta name="twitter:card" content="summary_large_image">

  <title>SAOPS - Encontrar um horário</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <script>try{var t=localStorage.getItem("saops_tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.png" alt=""> SAOPS</a>
    <h1>Encontrar um horário</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>

    <form action="busca.html" method="get">
      <label for="txt_busca">Buscar</label>
      <input type="search" id="txt_busca" name="busca" placeholder="Buscar barbearia, salão, clínica...">
      <button type="submit" id="btn_buscar">Buscar</button>
    </form>

    <section>
      <ul id="lista_resultados"></ul>
      <p id="status_busca"></p>
    </section>

  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/prestadores.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const termoInicial = (params.get('busca') || '').trim();
  document.getElementById('txt_busca').value = termoInicial;

  function renderizar(termo) {
    const lista = document.getElementById('lista_resultados');
    const status = document.getElementById('status_busca');
    const t = termo.toLowerCase();
    const resultados = PRESTADORES.filter((p) =>
      !t ||
      p.nome.toLowerCase().includes(t) ||
      p.categoria.toLowerCase().includes(t) ||
      p.bairro.toLowerCase().includes(t)
    );
    lista.innerHTML = '';
    if (!resultados.length) {
      status.innerHTML = '<div class="vazio"><span class="vazio-ico">🔍</span>Nenhum resultado para "' + esc(termo) + '".</div>';
      return;
    }
    status.innerHTML = '';
    resultados.forEach((p) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = 'detalhes-prestador.html?id=' + p.id;
      a.innerHTML = '<p>' + esc(p.nome) + '</p>' +
        '<span class="badge">⭐ ' + esc(p.estrelas) + ' · ' + esc(p.avaliacoes) + ' avaliações</span>' +
        '<p class="t-meta">' + esc(p.categoria) + ' · ' + esc(p.bairro) + '</p>';
      li.appendChild(a);
      lista.appendChild(li);
    });
  }

  document.querySelector('form').addEventListener('submit', (e) => {
    e.preventDefault();
    renderizar(document.getElementById('txt_busca').value.trim());
  });

  renderizar(termoInicial);
</script>

<script src="../js/tema.js"></script>
</body>
</html>
