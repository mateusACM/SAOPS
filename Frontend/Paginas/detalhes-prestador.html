  <script>try{var t=localStorage.getItem("saops_tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.png" alt=""> SAOPS</a>
    <a href="busca.html">&larr; Voltar</a>
    <h1 id="nome_prestador">Carregando...</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main id="conteudo">
    <div class="sk-card"><div class="sk-linha larga"></div><div class="sk-linha media"></div><div class="sk-linha curta"></div></div>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');
  const main = document.getElementById('conteudo');
  listarPrestadores().then((r) => {
    const p = r.sucesso && r.dados.find((x) => String(x.id) === String(id));
    if (!p) { document.getElementById('nome_prestador').textContent = 'Não encontrado'; main.textContent = 'Prestador não encontrado. Volte à busca e escolha novamente.'; return; }
    document.title = 'SAOPS - ' + p.nome; document.getElementById('nome_prestador').textContent = p.nome; main.replaceChildren();
    const sec = document.createElement('section'); const titulo = document.createElement('h2'); titulo.textContent = 'Sobre o negócio'; sec.append(titulo);
    const meta = document.createElement('p'); meta.textContent = [p.categoria, p.endereco].filter(Boolean).join(' · '); sec.append(meta); main.append(sec);
    const disponibilidade = p.disponibilidade || {}; const nomesDias = { seg: 'Seg', ter: 'Ter', qua: 'Qua', qui: 'Qui', sex: 'Sex', sab: 'Sáb', dom: 'Dom' };
    const diasAtivos = Object.entries(nomesDias).filter(([dia]) => disponibilidade[dia]?.ativo);
    if (diasAtivos.length) { const horas = document.createElement('p'); horas.className = 't-meta'; const horarios = diasAtivos.map(([dia, nome]) => `${nome} ${disponibilidade[dia].inicio}–${disponibilidade[dia].fim}`); horas.textContent = `Atendimento: ${horarios.join(' · ')} · horários a cada ${disponibilidade.intervalo_min || 30} min`; sec.append(horas); }
    const serv = document.createElement('section'); const h = document.createElement('h2'); h.textContent = 'Serviços'; serv.append(h);
    if (!p.servicos.length) { const vazio = document.createElement('p'); vazio.textContent = 'Este prestador ainda não cadastrou serviços.'; serv.append(vazio); }
    p.servicos.forEach((s) => { const item = document.createElement('article'); const n = document.createElement('h3'); n.textContent = s.nome; item.append(n); if (s.descricao) { const d = document.createElement('p'); d.textContent = s.descricao; item.append(d); } const info = document.createElement('p'); info.textContent = [s.duracao_min ? `${s.duracao_min} min` : '', s.preco == null ? 'Preço a combinar' : `R$ ${Number(s.preco).toFixed(2).replace('.', ',')}`].filter(Boolean).join(' · '); item.append(info); serv.append(item); });
    main.append(serv); const agendar = document.createElement('a'); agendar.href = 'agendamento.html?prestador=' + encodeURIComponent(p.id); const botao = document.createElement('button'); botao.type = 'button'; botao.textContent = 'Agendar horário'; agendar.append(botao); main.append(agendar);
  });
</script>

<script src="../js/tema.js"></script>
</body>
</html>
