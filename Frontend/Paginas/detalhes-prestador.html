<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="P2bUnYwtNrX8jA_so4X4Z8p4juoPq2-bmeh1EdOssuQ">
  <meta name="description" content="Veja os serviços, preços e horários do prestador e agende no SAOPS.">
  <meta name="theme-color" content="#03071f">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://saops-zjyx.onrender.com/detalhes-prestador">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SAOPS">
  <meta property="og:title" content="SAOPS - Barbearia Vintage">
  <meta property="og:description" content="Veja os serviços, preços e horários do prestador e agende no SAOPS.">
  <meta property="og:url" content="https://saops-zjyx.onrender.com/detalhes-prestador">
  <meta property="og:image" content="https://saops-zjyx.onrender.com/img/og-saops.jpg">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SAOPS - Barbearia Vintage">
  <meta name="twitter:description" content="Veja os serviços, preços e horários do prestador e agende no SAOPS.">
  <title>SAOPS - Barbearia Vintage</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <script>try{var t=localStorage.getItem("saops_tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.png" alt=""> SAOPS</a>
    <a href="busca.html">&larr; Voltar</a>
    <h1 id="nome_prestador">Carregando...</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main id="conteudo">
    <div class="sk-card"><div class="sk-linha larga"></div><div class="sk-linha media"></div><div class="sk-linha curta"></div></div>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');
  const main = document.getElementById('conteudo');
  // Mensagem pré-preenchida do WhatsApp clique-para-conversa.
  const MENSAGEM_WHATSAPP = 'Olá! Vi seu perfil no SAOPS e gostaria de agendar um horário.';
  const dias = [
    { chave: 'dom', nome: 'Domingo' }, { chave: 'seg', nome: 'Segunda' }, { chave: 'ter', nome: 'Terça' },
    { chave: 'qua', nome: 'Quarta' }, { chave: 'qui', nome: 'Quinta' }, { chave: 'sex', nome: 'Sexta' }, { chave: 'sab', nome: 'Sábado' }
  ];
  const elemento = (tag, classe, texto) => { const item = document.createElement(tag); if (classe) item.className = classe; if (texto !== undefined) item.textContent = texto; return item; };
  function estadoAtendimento(disponibilidade) {
    const agora = new Date(); const hoje = agora.getDay();
    const minutos = agora.getHours() * 60 + agora.getMinutes();
    const expedienteHoje = disponibilidade[dias[hoje].chave];
    if (expedienteHoje?.ativo) {
      const abre = Number(expedienteHoje.inicio.slice(0, 2)) * 60 + Number(expedienteHoje.inicio.slice(3));
      const fecha = Number(expedienteHoje.fim.slice(0, 2)) * 60 + Number(expedienteHoje.fim.slice(3));
      if (minutos >= abre && minutos < fecha) return ['status-open', '● Atendendo agora'];
      if (minutos < abre) return ['status-next', `Abre hoje às ${expedienteHoje.inicio}`];
    }
    for (let pulo = 1; pulo <= 7; pulo += 1) {
      const dia = dias[(hoje + pulo) % 7]; const expediente = disponibilidade[dia.chave];
      if (expediente?.ativo) return ['status-next', `Abre ${pulo === 1 ? 'amanhã' : `na ${dia.nome.toLowerCase()}`} às ${expediente.inicio}`];
    }
    return ['status-next', 'Agenda indisponível no momento'];
  }
  listarPrestadores().then((r) => {
    const p = r.sucesso && r.dados.find((x) => String(x.id) === String(id));
    if (!p) { document.getElementById('nome_prestador').textContent = 'Não encontrado'; main.textContent = 'Prestador não encontrado. Volte à busca e escolha novamente.'; return; }
    const nomesCategorias = { barbearia: 'Barbearia', salao: 'Salão de beleza', clinica: 'Clínica', outro: 'Outro' };
    const categoria = nomesCategorias[p.categoria] || 'Prestador independente';
    const resumo = p.bio || `${categoria} ${p.endereco ? `em ${p.endereco}` : 'no SAOPS'} com ${p.servicos.length} serviço${p.servicos.length === 1 ? '' : 's'} disponível${p.servicos.length === 1 ? '' : 'is'}.`;
    document.title = `${p.nome} | SAOPS`;
    document.querySelector('meta[name="description"]')?.setAttribute('content', resumo.slice(0, 155));
    document.querySelector('meta[property="og:title"]')?.setAttribute('content', `${p.nome} | SAOPS`);
    document.querySelector('meta[property="og:description"]')?.setAttribute('content', resumo.slice(0, 200));
    document.getElementById('nome_prestador').textContent = p.nome;
    main.replaceChildren(); main.className = 'public-profile';
    const disponibilidade = p.disponibilidade || {};

    const hero = elemento('section', 'public-profile-hero');
    if (typeof p.banner === 'string' && p.banner.startsWith('data:image/')) {
      const bannerNegocio = elemento('img', 'public-profile-banner');
      bannerNegocio.alt = ''; bannerNegocio.decoding = 'async'; bannerNegocio.src = p.banner;
      hero.append(bannerNegocio);
    }
    const avatar = elemento('div', 'public-profile-avatar'); avatar.setAttribute('aria-hidden', 'true');
    const fotoPerfil = (typeof p.foto_upload === 'string' && p.foto_upload) || (typeof p.foto === 'string' ? p.foto : '');
    if (fotoPerfil && /^(data:image\/|https?:\/\/)/.test(fotoPerfil)) {
      const avatarFoto = elemento('img', ''); avatarFoto.alt = ''; avatarFoto.decoding = 'async'; avatarFoto.src = fotoPerfil;
      avatar.append(avatarFoto);
    } else avatar.textContent = p.nome.trim().split(/\s+/).slice(0, 2).map((parte) => parte[0]).join('').toUpperCase();
    const intro = elemento('div', 'public-profile-intro');
    intro.append(elemento('p', 'auth-card-kicker', 'CONHEÇA SEU PRÓXIMO PROFISSIONAL'), elemento('h2', '', p.nome));
    const tags = elemento('div', 'profile-tags'); tags.append(elemento('span', 'profile-tag', categoria));
    if (p.endereco) tags.append(elemento('span', 'profile-tag', `⌖ ${p.endereco}`));
    const [estadoClasse, estadoTexto] = estadoAtendimento(disponibilidade); tags.append(elemento('span', `profile-tag ${estadoClasse}`, estadoTexto));
    intro.append(tags);
    const fatos = elemento('div', 'profile-facts');
    const fatoServicos = elemento('div', ''); fatoServicos.append(elemento('strong', '', String(p.servicos.length)), elemento('span', '', `serviço${p.servicos.length === 1 ? '' : 's'}`)); fatos.append(fatoServicos);
    if (p.anos_experiencia !== null && p.anos_experiencia !== undefined) { const fatoExperiencia = elemento('div', ''); fatoExperiencia.append(elemento('strong', '', `${Number(p.anos_experiencia)}${Number(p.anos_experiencia) === 1 ? ' ano' : ' anos'}`), elemento('span', '', 'de experiência')); fatos.append(fatoExperiencia); }
    const compartilhar = elemento('button', 'secundario profile-share', '↗ Compartilhar perfil'); compartilhar.type = 'button';
    compartilhar.addEventListener('click', async () => {
      try { if (navigator.share) await navigator.share({ title: p.nome, text: `Conheça ${p.nome} no SAOPS`, url: location.href }); else { await navigator.clipboard.writeText(location.href); toast('Link do perfil copiado!', 'sucesso'); } }
      catch (erro) { if (erro.name !== 'AbortError') toast('Não foi possível compartilhar neste dispositivo.', 'erro'); }
    });
    intro.append(fatos);
    // WhatsApp clique-para-conversa: o servidor nunca envia o link pronto —
    // ele é montado aqui, e o botão só existe se o prestador publicou um
    // número válido (10 ou 11 dígitos, sem DDI). Campo ausente/null/inválido
    // (backend antigo) não renderiza nada.
    const whatsappDigitos = typeof p.whatsapp === 'string' ? p.whatsapp.replace(/\D/g, '') : '';
    if (/^\d{10,11}$/.test(whatsappDigitos)) {
      const acoes = elemento('div', 'profile-cta-row');
      const whatsapp = elemento('a', 'btn-whatsapp', '');
      whatsapp.href = `https://wa.me/55${whatsappDigitos}?text=${encodeURIComponent(MENSAGEM_WHATSAPP)}`;
      whatsapp.target = '_blank';
      whatsapp.rel = 'noopener noreferrer';
      const icone = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icone.setAttribute('viewBox', '0 0 24 24');
      icone.setAttribute('width', '18');
      icone.setAttribute('height', '18');
      icone.setAttribute('fill', 'currentColor');
      icone.setAttribute('aria-hidden', 'true');
      const caminho = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      caminho.setAttribute('d', 'M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.2-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z');
      icone.append(caminho);
      whatsapp.append(icone, document.createTextNode('Falar no WhatsApp'));
      acoes.append(whatsapp);
      intro.append(acoes);
    }
    hero.append(avatar, intro, compartilhar); main.append(hero);

    const sobre = elemento('section', 'public-profile-panel profile-about');
    sobre.append(elemento('p', 'auth-card-kicker', 'UM POUCO SOBRE'), elemento('h2', '', 'Um atendimento com identidade'));
    sobre.append(elemento('p', 'profile-bio', p.bio || 'Este profissional ainda não escreveu uma apresentação. Entre em contato pelo agendamento e conheça o trabalho de perto.'));
    if (p.instagram) { const instagram = elemento('a', 'profile-instagram', `◎  Acompanhe @${p.instagram}`); instagram.href = `https://www.instagram.com/${encodeURIComponent(p.instagram)}/`; instagram.target = '_blank'; instagram.rel = 'noopener noreferrer'; sobre.append(instagram); }
    main.append(sobre);

    const agenda = elemento('section', 'public-profile-panel profile-hours');
    const agendaHeading = elemento('div', 'profile-section-heading'); const agendaTitle = elemento('div', ''); agendaTitle.append(elemento('p', 'auth-card-kicker', 'PLANEJE SUA VISITA'), elemento('h2', '', 'Horários de atendimento')); agendaHeading.append(agendaTitle); agenda.append(agendaHeading);
    const grade = elemento('div', 'profile-week');
    dias.slice(1).concat(dias.slice(0, 1)).forEach(({ chave, nome }) => {
      const d = disponibilidade[chave]; const card = elemento('div', `profile-day${d?.ativo ? ' ativo' : ''}`);
      card.append(elemento('strong', '', nome.slice(0, 3)), elemento('span', '', d?.ativo ? `${d.inicio} – ${d.fim}` : 'Fechado')); grade.append(card);
    });
    agenda.append(grade, elemento('p', 'profile-hours-note', `Novos horários a cada ${disponibilidade.intervalo_min || 30} minutos.`)); main.append(agenda);

    const servicos = elemento('section', 'public-profile-panel profile-services');
    const heading = elemento('div', 'profile-section-heading'); heading.append(elemento('div', '', '')); heading.firstChild.append(elemento('p', 'auth-card-kicker', 'ESCOLHA O QUE COMBINA COM VOCÊ'), elemento('h2', '', 'Serviços'));
    heading.append(elemento('span', 'profile-service-count', `${p.servicos.length} opção${p.servicos.length === 1 ? '' : 'ões'}`)); servicos.append(heading);
    if (!p.servicos.length) servicos.append(elemento('p', 'business-help', 'Este prestador ainda não cadastrou serviços.'));
    p.servicos.forEach((s) => {
      const card = elemento('article', 'public-service-card'); const copy = elemento('div', '');
      copy.append(elemento('h3', '', s.nome)); if (s.descricao) copy.append(elemento('p', 'public-service-description', s.descricao));
      const detalhes = [s.duracao_min ? `◷ ${s.duracao_min} min` : '', s.preco == null ? 'Preço a combinar' : `R$ ${Number(s.preco).toFixed(2).replace('.', ',')}`].filter(Boolean).join('  ·  ');
      const rodape = elemento('div', 'public-service-footer'); rodape.append(elemento('span', 'public-service-meta', detalhes));
      const link = elemento('a', 'public-service-book', 'Agendar →'); link.href = `agendamento.html?prestador=${encodeURIComponent(p.id)}&servico=${encodeURIComponent(s.nome)}`; rodape.append(link);
      card.append(copy, rodape); servicos.append(card);
    });
    main.append(servicos);
    if (p.servicos.length) { const cta = elemento('a', 'profile-main-cta', 'Encontrar um horário disponível'); cta.href = `agendamento.html?prestador=${encodeURIComponent(p.id)}`; servicos.append(cta); }
  }).catch(() => { main.textContent = 'Não foi possível carregar este perfil agora. Tente novamente.'; });
</script>

<script src="../js/tema.js"></script>
</body>
</html>
