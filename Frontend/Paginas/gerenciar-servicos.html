  <title>SAOPS - Gerenciar serviços</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <script>try{var t=localStorage.getItem("saops_tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.png" alt=""> SAOPS</a>
    <a href="agenda-prestador.html">&larr; Voltar</a>
    <h1>Meus serviços</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>

    <section>
      <ul>
        <li>
          <form action="#" method="post">
            <label for="txt_nome_servico_1">Nome do serviço</label>
            <input type="text" id="txt_nome_servico_1" name="nome-servico-1" value="Corte de cabelo">

            <label for="txt_duracao_servico_1">Duração (minutos)</label>
            <input type="number" id="txt_duracao_servico_1" name="duracao-servico-1" value="40">

            <label for="txt_preco_servico_1">Preço (R$)</label>
            <input type="number" id="txt_preco_servico_1" name="preco-servico-1" value="45">

            <button type="submit" id="btn_salvar_servico_1">Salvar</button>
            <button type="button" id="btn_remover_servico_1">Remover</button>
          </form>
        </li>
        <li>
          <form action="#" method="post">
            <label for="txt_nome_servico_2">Nome do serviço</label>
            <input type="text" id="txt_nome_servico_2" name="nome-servico-2" value="Barba">

            <label for="txt_duracao_servico_2">Duração (minutos)</label>
            <input type="number" id="txt_duracao_servico_2" name="duracao-servico-2" value="25">

            <label for="txt_preco_servico_2">Preço (R$)</label>
            <input type="number" id="txt_preco_servico_2" name="preco-servico-2" value="30">

            <button type="submit" id="btn_salvar_servico_2">Salvar</button>
            <button type="button" id="btn_remover_servico_2">Remover</button>
          </form>
        </li>
        <li>
          <form action="#" method="post">
            <label for="txt_nome_servico_3">Nome do serviço</label>
            <input type="text" id="txt_nome_servico_3" name="nome-servico-3" value="Corte + barba">

            <label for="txt_duracao_servico_3">Duração (minutos)</label>
            <input type="number" id="txt_duracao_servico_3" name="duracao-servico-3" value="60">

            <label for="txt_preco_servico_3">Preço (R$)</label>
            <input type="number" id="txt_preco_servico_3" name="preco-servico-3" value="65">

            <button type="submit" id="btn_salvar_servico_3">Salvar</button>
            <button type="button" id="btn_remover_servico_3">Remover</button>
          </form>
        </li>
      </ul>
    </section>

    <section>
      <h2>Adicionar novo serviço</h2>
      <form action="#" method="post">
        <label for="txt_nome_novo_servico">Nome do serviço</label>
        <input type="text" id="txt_nome_novo_servico" name="nome-servico" placeholder="Ex: Coloração" required>

        <label for="txt_duracao_novo_servico">Duração (minutos)</label>
        <input type="number" id="txt_duracao_novo_servico" name="duracao" placeholder="30" required>

        <label for="txt_preco_novo_servico">Preço (R$)</label>
        <input type="number" id="txt_preco_novo_servico" name="preco" placeholder="50" required>

        <button type="submit" id="btn_adicionar_servico">Adicionar serviço</button>
      </form>
    </section>

  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/tema.js"></script>
</body>
</html>
